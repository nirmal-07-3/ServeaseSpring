<aside
  class="sidebar"
  [class.open]="isOpen"
>

  <!-- Brand -->

  <div class="sidebar-header">

    <a
      routerLink="/home"
      class="brand"
      (click)="closeSidebar()"
    >

      <span class="brand-mark">
        S
      </span>

      <span class="brand-name">
        Servease
      </span>

    </a>


    <button
      type="button"
      class="close-button"
      (click)="closeSidebar()"
      aria-label="Close navigation"
    >
      ×
    </button>

  </div>


  <!-- Navigation -->

  <nav class="navigation">

    <p class="navigation-title">
      MENU
    </p>

    @for (item of navigationItems; track item.route) {

    <a
      class="nav-item"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeSidebar()"
    >

        <span class="nav-icon">
          {{ item.icon }}
        </span>

      <span class="nav-label">
          {{ item.label }}
        </span>

    </a>

    }

  </nav>


  <!-- Bottom -->

  <div class="sidebar-bottom">

    <a
      routerLink="/settings"
      class="nav-item"
      (click)="closeSidebar()"
    >

      <span class="nav-icon">
        ⚙
      </span>

      <span class="nav-label">
        Settings
      </span>

    </a>


    <button
      type="button"
      class="logout-button"
      (click)="logout()"
    >

      <span class="nav-icon">
        ↪
      </span>

      <span class="nav-label">
        Logout
      </span>

    </button>

  </div>

</aside>
