<ng-container *ngIf="isProviderRoute; else sharedLayout">
  <router-outlet></router-outlet>
</ng-container>

<ng-template #sharedLayout>
  <div class="app-shell">
    <div
      class="sidebar-overlay"
      [class.visible]="sidebarOpen"
      (click)="closeSidebar()"
    ></div>

    <app-sidebar
      [isOpen]="sidebarOpen"
      (close)="closeSidebar()"
    ></app-sidebar>

    <div class="main-area">
      <header class="topbar">
        <button
          class="menu-button"
          type="button"
          (click)="toggleSidebar()"
          aria-label="Open navigation"
        >
          ☰
        </button>

        <div class="topbar-spacer"></div>

        <button
          class="icon-button"
          type="button"
          aria-label="Notifications"
        >
          <span>♧</span>
          <span class="notification-dot"></span>
        </button>

        <a
          class="user-button"
          routerLink="/profile"
          aria-label="Open profile"
        >
          <div class="avatar">
            {{ getUserInitials() }}
          </div>

          <div class="user-info">
            <span class="user-name">{{ userName }}</span>
            <span class="user-role">{{ userRole }}</span>
          </div>

          <span class="chevron">˅</span>
        </a>
      </header>

      <main class="page-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</ng-template>
