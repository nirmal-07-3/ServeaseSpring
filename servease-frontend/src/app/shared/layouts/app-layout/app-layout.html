
<div class="app-shell">
  <div
    class="sidebar-overlay"
    [class.visible]="sidebarOpen"
    (click)="closeSidebar()"
  ></div>

  <app-sidebar
    [isOpen]="sidebarOpen"
    (close)="closeSidebar()"
  ></app-sidebar>

  <div class="main-area">
    <header class="topbar">
      <button
        class="menu-button"
        type="button"
        (click)="toggleSidebar()"
        aria-label="Open navigation"
      >
        ☰
      </button>

      <div class="topbar-spacer"></div>

      <div class="notification-wrapper">
        <button
          class="icon-button"
          type="button"
          aria-label="Notifications"
          [attr.aria-expanded]="notificationsOpen"
          (click)="toggleNotifications()"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
            ></path>
            <path d="M10 21h4"></path>
          </svg>

          <span
            class="notification-count"
            *ngIf="unreadCount > 0"
          >
            {{ unreadCount > 99 ? '99+' : unreadCount }}
          </span>
        </button>

        <section
          class="notification-panel"
          *ngIf="notificationsOpen"
          aria-label="Notifications list"
        >
          <div class="notification-header">
            <div>
              <h3>Notifications</h3>
              <p>{{ unreadCount }} unread</p>
            </div>

            <button
              type="button"
              class="mark-all-button"
              [disabled]="unreadCount === 0 || markingAllAsRead"
              (click)="markAllAsRead()"
            >
              {{ markingAllAsRead ? 'Updating...' : 'Mark all read' }}
            </button>
          </div>

          <div
            class="notification-error"
            *ngIf="notificationError"
          >
            <span>{{ notificationError }}</span>

            <button
              type="button"
              (click)="loadNotifications()"
            >
              Retry
            </button>
          </div>

          <div
            class="notification-loading"
            *ngIf="notificationsLoading"
          >
            <span class="loading-spinner"></span>
            <span>Loading notifications...</span>
          </div>

          <div
            class="notification-empty"
            *ngIf="
              !notificationsLoading &&
              !notificationError &&
              notifications.length === 0
            "
          >
            <span class="empty-bell">♧</span>
            <strong>You're all caught up</strong>
            <p>New updates will appear here.</p>
          </div>

          <div
            class="notification-list"
            *ngIf="
              !notificationsLoading &&
              notifications.length > 0
            "
          >
            <button
              type="button"
              class="notification-item"
              *ngFor="let notification of notifications"
              [class.unread]="!notification.read"
              [disabled]="markingReadIds.has(notification.id)"
              (click)="openNotification(notification)"
            >
              <span class="notification-icon">
                {{ getNotificationIcon(notification.type) }}
              </span>

              <span class="notification-content">
                <span class="notification-title">
                  {{ notification.title }}
                </span>

                <span class="notification-message">
                  {{ notification.message }}
                </span>

                <span class="notification-date">
                  {{ formatNotificationDate(notification.createdAt) }}
                </span>
              </span>

              <span
                class="unread-indicator"
                *ngIf="!notification.read"
                aria-label="Unread"
              ></span>
            </button>
          </div>
        </section>
      </div>

      <a
        class="user-button"
        [routerLink]="userRole === 'PROVIDER'
          ? '/provider/profile'
          : userRole === 'ADMIN'
            ? '/admin/profile'
            : '/profile'"
        aria-label="Open profile"
      >
        <div class="avatar">
          {{ getUserInitials() }}
        </div>

        <div class="user-info">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">{{ userRole }}</span>
        </div>

        <span class="chevron">˅</span>
      </a>
    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
