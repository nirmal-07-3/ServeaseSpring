<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Servease</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <!-- Brand -->
        <div class="brand">
            <div class="brand-logo">S</div>
            <span>Servease</span>
        </div>

        <!-- Header -->
        <div class="auth-header">

            <h2>Create your account</h2>

            <p>
                Join Servease and get started today.
            </p>

        </div>


        <form id="registerForm">

            <!-- Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                >

            </div>


            <!-- Phone -->
            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel"
                        required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                >

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                >

            </div>


            <!-- Role -->
            <div class="form-group">

                <label for="role">
                    Account Type
                </label>

                <select
                        id="role"
                        name="role"
                        required
                >

                    <option value="">
                        Select account type
                    </option>

                    <option value="CUSTOMER">
                        Customer
                    </option>

                    <option value="PROVIDER">
                        Service Provider
                    </option>

                </select>

            </div>


            <!-- Message -->
            <div id="message" class="message"></div>


            <!-- Register -->
            <button
                    type="submit"
                    id="registerBtn"
                    class="primary-button">

                Create Account

            </button>

        </form>


        <!-- Login -->
        <div class="register-text" style="margin-top: 24px;">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<script src="js/register.js"></script>

</body>
</html>
